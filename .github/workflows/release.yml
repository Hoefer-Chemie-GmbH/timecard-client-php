# Tags the version in composer.json when no tag exists yet; consumers install via Composer `repositories: vcs`.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          v=$(php -r 'echo json_decode(file_get_contents("composer.json"))->version;')
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "tag v$v exists"; exit 0; fi
          git tag "v$v" && git push origin "v$v"
