name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: php -l src/GoogleServiceAccountToken.php && php -l src/ProblemDetails.php
      - run: vendor/bin/phpunit
